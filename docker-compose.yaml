services:
  gerenciakids_db:
    image: mysql:8.0
    container_name: gerenciakids_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gerenciakids_lite
    ports:
      - "3306:3306"
    volumes:
      - gerenciakids_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gerenciakids_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: gerenciakids_db
      PMA_PORT: 3306
    depends_on:
      - gerenciakids_db

volumes:
  gerenciakids_mysql_data:

